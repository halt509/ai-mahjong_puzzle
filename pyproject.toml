[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-mahjong-puzzle"
version = "0.4.0"
description = "Pyxel麻雀牌上書きパズル"
requires-python = ">=3.11"
dependencies = ["pyxel>=2.9,<3"]

[project.scripts]
mahjong-puzzle = "mahjong_puzzle.app:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
